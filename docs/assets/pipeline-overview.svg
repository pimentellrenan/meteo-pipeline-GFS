<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GFS weather pipeline overview</title>
  <desc id="desc">A diagram showing NOAA GFS data flowing through download, transform, and CSV output steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#f8fafc"/>
  <text x="60" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">GFS Weather Pipeline</text>
  <text x="60" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#475569">Download GRIB2 forecasts, extract monitored points, and publish tidy CSV output.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="70" y="170" width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="165" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">NOAA GFS</text>
    <text x="165" y="244" text-anchor="middle" font-size="15" fill="#475569">public GRIB2 files</text>
    <rect x="350" y="170" width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="445" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Download</text>
    <text x="445" y="244" text-anchor="middle" font-size="15" fill="#475569">cache + retries</text>
    <rect x="630" y="170" width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="725" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Transform</text>
    <text x="725" y="244" text-anchor="middle" font-size="15" fill="#475569">nearest point values</text>
    <rect x="910" y="170" width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1005" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CSV Output</text>
    <text x="1005" y="244" text-anchor="middle" font-size="15" fill="#475569">tidy forecast table</text>
    <path d="M260 225 H338" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
    <path d="M540 225 H618" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
    <path d="M820 225 H898" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  </g>
</svg>
